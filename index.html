<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Courses</title>
  <meta name="description" content="Liste de courses simple et épurée." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Courses" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 id="pageTitle">Liste</h1>
      <button id="weekBtn" class="week-btn" aria-haspopup="true" aria-label="Choisir la semaine">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 7v10H5V9h14Z"/></svg>
        <span id="weekBtnLabel">Cette semaine</span>
        <svg class="week-chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </button>
    </header>

    <form id="addForm" class="add-bar" autocomplete="off">
      <input id="addInput" class="add-input" type="text" placeholder="Ajouter un article…" enterkeyhint="done" />
      <select id="addCategory" class="add-cat" aria-label="Catégorie"></select>
      <button type="submit" class="add-btn" aria-label="Ajouter">+</button>
    </form>

    <main class="content">
      <section id="view-liste" class="view"></section>

      <section id="view-historique" class="view hidden">
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="search" placeholder="Rechercher…" enterkeyhint="search" />
        </div>
        <div id="historiqueList"></div>
      </section>

      <section id="view-categories" class="view hidden">
        <form id="addCatForm" class="add-cat-form">
          <input id="newCatInput" class="cat-input" type="text" placeholder="Nouvelle catégorie…" />
          <button type="submit" class="add-btn">+</button>
        </form>
        <ul id="catList" class="cat-list"></ul>
      </section>
    </main>
  </div>

  <!-- Barre de navigation flottante (style iOS) -->
  <nav class="tabbar" role="tablist" aria-label="Navigation">
    <div class="tabbar-inner">
      <div class="tabbar-indicator" id="tabIndicator"></div>

      <button class="tab-item active" data-tab="liste" role="tab" aria-label="Liste">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM2.2 3a1 1 0 0 0 0 2h1.6l2.6 9.6A2 2 0 0 0 8.3 16h8.8a2 2 0 0 0 1.9-1.4l2.3-7.3A1 1 0 0 0 20.4 6H6.3l-.5-1.8A1.6 1.6 0 0 0 4.3 3H2.2Z"/></svg>
          <span class="tab-badge hidden" id="listeBadge">0</span>
        </span>
        <span class="tab-label">Liste</span>
      </button>

      <button class="tab-item" data-tab="historique" role="tab" aria-label="Historique">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M13 3a9 9 0 1 0 8.94 10h-2.02A7 7 0 1 1 13 5a7 7 0 0 1 6.32 4H16v2h6V5h-2v2.07A9 9 0 0 0 13 3Zm-1 4v6l5 3 .9-1.5-4.4-2.6V7H12Z"/></svg>
        </span>
        <span class="tab-label">Historique</span>
      </button>

      <button class="tab-item" data-tab="categories" role="tab" aria-label="Catégories">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M10.4 3a2 2 0 0 0-1.4.6l-6 6a2 2 0 0 0 0 2.8l6.6 6.6a2 2 0 0 0 2.8 0l6-6a2 2 0 0 0 .6-1.4V5a2 2 0 0 0-2-2h-6.6ZM16 6.2a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Z"/></svg>
        </span>
        <span class="tab-label">Catégories</span>
      </button>
    </div>
  </nav>

  <!-- Menu sélection de semaine -->
  <div id="weekBackdrop" class="week-backdrop hidden"></div>
  <div id="weekMenu" class="week-menu hidden" role="menu" aria-label="Choisir la semaine">
    <div class="week-menu-title">Choisir la semaine</div>
    <div id="weekMenuList" class="week-menu-list"></div>
  </div>

  <!-- Feuille : copier une autre semaine -->
  <div id="copyBackdrop" class="sheet-backdrop hidden"></div>
  <div id="copySheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Copier une autre semaine">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Copier une autre semaine</div>
    <div class="sheet-sub">Les articles seront ajoutés à <strong id="copyTargetLabel"></strong>.</div>
    <div id="copyList" class="week-menu-list"></div>
  </div>

  <!-- iOS install hint -->
  <div id="iosHint" class="ios-hint hidden">
    <span>Pour installer&nbsp;: <strong>Partager</strong> <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3l4 4-1.4 1.4L13 6.8V15h-2V6.8L9.4 8.4 8 7l4-4Zm-7 8h3v2H7v6h10v-6h-2v-2h3a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z"/></svg> puis <strong>Sur l'écran d'accueil</strong></span>
    <button id="iosHintClose" class="ios-hint-close" aria-label="Fermer">×</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
